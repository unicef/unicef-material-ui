# Workflow for publishing legacy v1.x fixes to npm
# Publishes under the "legacy" dist-tag to avoid overwriting "latest" (v2.x)
name: Publish Legacy v1.x in npmjs

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Message'
        required: false
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v.1x   # Ensure we always build from the legacy branch
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v.1x   # Ensure we always publish from the legacy branch
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org
          cache: 'npm'
      - run: npm ci
      - run: npm publish --access=public --tag legacy

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v.1x
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: https://npm.pkg.github.com/
          cache: 'npm'
      - run: npm ci
      - run: npm publish --tag legacy
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
